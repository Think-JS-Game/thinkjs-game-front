server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Dynamic Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # Security Headers (Point 23 & 54: CSP com 'wasm-unsafe-eval' sem 'unsafe-eval')
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8000 http://backend:8000;" always;

    # Assets estáticos com hash: Cache Imutável (Point 26)
    location ~* \.(?:css|js|wasm|worker\.js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fontes e Imagens
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Proxy para API em Produção / Docker Compose (opcional)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Fallback (Point 25) — redireciona rotas React para index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html não deve ser agressivamente cacheado
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Container Healthcheck (Point 57)
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
